[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dldemo"
version = "0.4.0"
description = "Teaching helpers for Deep Learning (Demo), E1234"
readme = "README.md"
requires-python = ">=3.10"
# No runtime dependencies ON PURPOSE: `pip install -e .` must work in any student
# environment, and a partially released package must still import.
dependencies = []

[tool.setuptools]
packages = ["dldemo"]
