# SYSTEM-OWNED - do not edit, edits here are overwritten. This workflow is
# re-rendered from the central DSL teaching toolkit by 'Refresh actions' (nightly).
name: Release materials

# Run from a course content repo: course_source_repo is pre-filled with THIS repo (editable).
# Copies the given path(s) into the semester org. course_source_path and
# semester_dest_path are comma-separated parallel lists paired by index - leave
# semester_dest_path blank to mirror course_source_path. These are exactly a schedule.yml
# `deploy:` entry's fields.
# The semester dropdown is refreshed by the 'Refresh actions' workflow.

on:
  workflow_dispatch:
    inputs:
      course_source_repo:
        description: "1. repo to release from in the course org"
        required: true
        default: "lecture-code-f2026"
      course_source_path:
        description: "2. within-repo folder/file path to copy from (or comma-separated list)"
        required: true
      semester_org:
        description: "3. target semester org"
        required: true
        type: choice
        default: "hertie-dsl-demo-f2026"
        options:
          - hertie-dsl-demo-f2025
          - hertie-dsl-demo-f2026
      semester_dest_repo:
        description: "4. repo to release to in the semester org; created if missing"
        default: "materials"
        required: true
      semester_dest_path:
        description: "5. within-repo destination path (blank mirrors box 2's path(s)); created if missing"
        required: false

concurrency:
  group: ${{ github.repository }}-release-materials
  cancel-in-progress: false

permissions: {}

jobs:
  check-team:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the user may run actions for THIS repo
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          # Faculty & instructors have write+ on the course repos; students never do (and triggering a
          # workflow_dispatch already requires write), so repo permission is the gate.
          perm=$(gh api "repos/$REPO/collaborators/$ACTOR/permission" --jq '.permission' 2>/tmp/gherr || true)
          case "$perm" in admin|write|maintain) exit 0 ;; esac
          echo "::error::@$ACTOR lacks write on $REPO (permission='$perm'). gh api said:"
          cat /tmp/gherr || true
          exit 1

  release:
    needs: check-team
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: hertie-data-science-lab/dsl-teaching-toolkit
          ref: preview
          # No credential left behind in $GITHUB_WORKSPACE/.git/config. Nothing here ever
          # pushes to the checkout - the central repo is public and read-only to these
          # jobs, and every write goes through `gh`/`gh auth setup-git` against ANOTHER
          # repo - so the persisted header buys nothing, and the grading jobs run the
          # student's own code with this directory on disk.
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.DSL_BOT_TOKEN }}
          COURSE_ORG: ${{ github.repository_owner }}
          COURSE_SOURCE_REPO: ${{ inputs.course_source_repo }}
          SEMESTER_ORG: ${{ inputs.semester_org }}
          COURSE_SOURCE_PATH: ${{ inputs.course_source_path }}
          SEMESTER_DEST_REPO: ${{ inputs.semester_dest_repo }}
          SEMESTER_DEST_PATH: ${{ inputs.semester_dest_path }}
        run: |
          gh auth setup-git
          python3 -m dsl_course.deploy --course-org "$COURSE_ORG" \
            --course-source-repo "$COURSE_SOURCE_REPO" --semester-org "$SEMESTER_ORG" \
            --course-source-path "$COURSE_SOURCE_PATH" --semester-dest-repo "$SEMESTER_DEST_REPO" \
            --semester-dest-path "$SEMESTER_DEST_PATH" --no-preview
